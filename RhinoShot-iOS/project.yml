# RhinoShot for iOS — XcodeGen project definition
#
# Generate the Xcode project with:
#     ./bootstrap.sh          (installs XcodeGen if needed and runs it)
# or manually:
#     xcodegen generate
#
# The project is generated on purpose: the file stays in git and every change
# is reviewable, instead of a binary .xcodeproj with merge conflicts.

name: RhinoShot

options:
  bundleIdPrefix: ir.rhinoshot
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  MediaPipeTasks:
    url: https://github.com/google-ai-edge/mediapipe.git
    from: "1.1.1"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RhinoShot:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RhinoShot
        excludes:
          - "Info.plist"
          - "Resources"
          - "Assets.xcassets"
          - "PrivacyInfo.xcprivacy"
    resources:
      - path: RhinoShot/Resources
      - path: RhinoShot/Assets.xcassets
      - path: RhinoShot/PrivacyInfo.xcprivacy
    dependencies:
      - package: MediaPipeTasks
        product: MediaPipeTasksVision
    settings:
      base:
        PRODUCT_NAME: RhinoShot
        PRODUCT_BUNDLE_IDENTIFIER: ir.rhinoshot.clinic
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_FILE: RhinoShot/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # The clinic photos must never leave the device in the background.
        OTHER_SWIFT_FLAGS: ""
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
